name: Build Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tests/fixtures/excel/**'
      - 'scripts/build_excel_fixtures.py'
      - 'scripts/run_excel_fixtures.py'
      - 'tests/live_excel_testing/module_only.xlsm'
      - '.github/workflows/excel_macro_test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/fixtures/excel/**'
      - 'scripts/build_excel_fixtures.py'
      - 'scripts/run_excel_fixtures.py'
      - 'tests/live_excel_testing/module_only.xlsm'
      - '.github/workflows/excel_macro_test.yml'

jobs:
  test-fast:
    name: Test pre-built fixture (fast)
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup VBA
        uses: DecimalTurn/setup-vba@797e4a232699a98507cb4411d5bea3697427ad57 # v0.3.0
        with:
          office-apps: Excel

      - name: Install pywin32
        shell: pwsh
        run: |
          pip install pywin32
          python -m Scripts.pywin32_postinstall -install

      - name: Test module_only.xlsm
        shell: pwsh
        run: |
          python -c "
import sys, time
from pathlib import Path
xlsm = Path('tests/live_excel_testing/module_only.xlsm')
if not xlsm.exists():
    print(f'ERROR: {xlsm} not found')
    sys.exit(1)
import win32com.client
xl = None
try:
    print(f'  Opening {xlsm.name}...', end=' ', flush=True)
    xl = win32com.client.Dispatch('Excel.Application')
    xl.DisplayAlerts = False
    xl.Visible = False
    wb = xl.Workbooks.Open(str(xlsm.absolute()))
    time.sleep(0.5)
    print('running macro...', end=' ', flush=True)
    xl.Application.Run('Module1.RunFixture')
    time.sleep(0.5)
    wb.Close(SaveChanges=False)
    print('closed.', end=' ', flush=True)
    expected = xlsm.with_suffix('.txt')
    time.sleep(0.5)
    if not expected.exists():
        print(f'FAIL')
        sys.exit(1)
    content = expected.read_text(encoding='utf-8').strip()
    print(f'PASS -> {content!r}')
finally:
    if xl:
        try: xl.Quit()
        except: pass
          "

  test-full:
    name: Build and test all fixtures
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build Excel fixtures
        run: python scripts/build_excel_fixtures.py

      - name: Setup VBA
        uses: DecimalTurn/setup-vba@797e4a232699a98507cb4411d5bea3697427ad57 # v0.3.0
        with:
          office-apps: Excel

      - name: Install pywin32
        shell: pwsh
        run: |
          pip install pywin32
          python -m Scripts.pywin32_postinstall -install

      - name: Run Excel macros and verify output
        run: python scripts/run_excel_fixtures.py
